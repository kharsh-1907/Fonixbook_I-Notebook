<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="100%" stop-color="#0F081D" />
    </linearGradient>

    <!-- Graphic Gradient -->
    <linearGradient id="fonixIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="50%" stop-color="#DD2476" />
      <stop offset="100%" stop-color="#8811E9" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#DD2476" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#iconBgGrad)" />

  <!-- Main Icon Group -->
  <g transform="translate(106, 96)" filter="url(#iconGlow)">
    <!-- Notepad Base -->
    <rect x="0" y="0" width="300" height="360" rx="44" fill="url(#fonixIconGrad)" />

    <!-- Notepad Ring Binder Cuts -->
    <circle cx="56" cy="70" r="14" fill="#1E1035" />
    <circle cx="56" cy="180" r="14" fill="#1E1035" />
    <circle cx="56" cy="290" r="14" fill="#1E1035" />

    <!-- Inner Page Element (Flame / Feather Sheet) -->
    <path d="M 120 70 
             C 175 70, 230 100, 230 155 
             C 230 230, 140 245, 220 290 
             L 115 290 
             C 115 290, 115 130, 120 70 Z" 
          fill="#FFFFFF" />

    <!-- Accent Swash -->
    <path d="M 140 130 C 175 130, 200 150, 195 180 C 185 215, 140 220, 185 255" 
          stroke="url(#fonixIconGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>
</svg>
